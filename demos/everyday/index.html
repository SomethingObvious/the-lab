<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>The Lab</title>
<link rel="preload" href="fonts/RobotoFlex.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (() => {
    const q = new URLSearchParams(location.search);
    const t = q.get('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    const p = q.get('palette');
    if (p === 'grape' || p === 'berry') document.documentElement.dataset.palette = p;
  })();
</script>
<link rel="stylesheet" href="app.css">
<script src="../mock-bridge.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-files" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 3.5 3 3-2.5 4.5 4"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9.5 7.5v9M14.5 7.5v9"/></symbol>
    <symbol id="i-check"viewBox="0 0 24 24"><path d="m5.5 12.5 4 4 9-9"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6.5v5c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9v-5l-7-3z"/><path d="M12 8v4.5M12 15.5v.5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 6 13.5h5L10 21l7-10.5h-5L13 3z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.5"/><path d="M7 14h4"/><circle cx="16.5" cy="14" r=".6" fill="currentColor"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12.5H7z"/><path d="M13 3.5V8.5h5M9.5 12.5h6M9.5 16h6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.8"/><path d="m4 17.5 5-4.5 4 3.5 2.5-2 4.5 3.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5 5.5 15 15.5 5a2.1 2.1 0 0 1 3 3l-10 10z"/><path d="m13.5 7 3 3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M19 8.5A8 8 0 1 0 20 13"/><path d="M19.5 3.5v5h-5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.3L12 16l-4.9 2.6 1.1-5.3-4-3.7 5.4-.6z"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M3 9.5a13 13 0 0 1 18 0M6 13a8.5 8.5 0 0 1 12 0M9 16.5a4 4 0 0 1 6 0"/><circle cx="12" cy="19.5" r=".8" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="bar" id="bar">
    <div class="bar-row" id="bar-main">
      <h1 class="title">The Lab</h1>
      <button type="button" class="icon-btn on-brand" id="open-search" aria-label="Search">
        <svg class="ic"><use href="#i-search"/></svg>
      </button>
      <button type="button" class="icon-btn on-brand" id="open-files" aria-label="Files and Photos">
        <svg class="ic"><use href="#i-files"/></svg>
      </button>
    </div>
    <form class="bar-row search-row" id="search-row" hidden>
      <button type="button" class="icon-btn on-brand" id="close-search" aria-label="Close Search">
        <svg class="ic"><use href="#i-back"/></svg>
      </button>
      <input type="search" id="search" class="search" placeholder="Search requests and replies" aria-label="Search requests and replies" autocomplete="off" enterkeyhint="search">
    </form>
    <button type="button" class="glance" id="glance" aria-expanded="false" aria-controls="glance-more">
      <span class="glance-line" id="glance-line"></span>
      <span class="glance-more" id="glance-more" hidden></span>
    </button>
  </header>

  <div class="now" id="now" hidden>
    <span class="now-mark" id="now-mark" aria-hidden="true"></span>
    <span class="now-text"><span class="now-label" id="now-label"></span><span class="now-time" id="now-time"></span></span>
    <button type="button" class="now-btn" id="now-jump" hidden>Review</button>
    <button type="button" class="now-btn stop" id="now-stop"><svg class="ic"><use href="#i-stop"/></svg>Stop</button>
  </div>

  <div class="banner" id="banner" hidden role="status">
    <svg class="ic"><use href="#i-wifi"/></svg>
    <p id="banner-text"></p>
    <button type="button" class="banner-btn" id="banner-fix" hidden>Open Tailscale</button>
    <button type="button" class="banner-btn" id="banner-retry">Try Again</button>
  </div>

  <aside class="side" id="side" aria-label="Requests">
    <div class="side-search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="side-search" placeholder="Search" aria-label="Search requests and replies" autocomplete="off">
    </div>
    <ol class="side-list" id="side-list"></ol>
  </aside>

  <main class="main" id="main">
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="results" id="results" hidden></div>
    <section class="files-view" id="files-view" hidden aria-label="Files and photos">
      <div class="files-head">
        <button type="button" class="icon-btn" id="close-files" aria-label="Back to the Conversation">
          <svg class="ic"><use href="#i-back"/></svg>
        </button>
        <h2>Files and Photos</h2>
      </div>
      <div class="files-body" id="files-body"></div>
    </section>
  </main>

  <footer class="composer" id="composer">
    <div class="chips" id="chips" role="toolbar" aria-label="Shortcuts"></div>
    <div class="pending" id="pending" hidden></div>
    <form class="input-row" id="form">
      <div class="attach-wrap">
        <button type="button" class="round tonal" id="attach" aria-label="Attach" aria-expanded="false" aria-controls="attach-menu">
          <svg class="ic"><use href="#i-plus"/></svg>
        </button>
        <div class="menu" id="attach-menu" hidden>
          <button type="button" data-attach="photos"><svg class="ic"><use href="#i-image"/></svg>Photos</button>
          <button type="button" data-attach="files"><svg class="ic"><use href="#i-doc"/></svg>Files</button>
        </div>
      </div>
      <textarea id="text" rows="1" placeholder="Message your Mac" aria-label="Message your Mac" enterkeyhint="send"></textarea>
      <button type="submit" class="round brand" id="send" aria-label="Send" disabled>
        <svg class="ic"><use href="#i-send"/></svg>
      </button>
    </form>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <h2 id="sheet-title"></h2>
  <div id="sheet-body"></div>
  <div class="sheet-actions" id="sheet-actions"></div>
</section>
<div class="toast" id="toast" role="alert" hidden></div>
</body>
</html>
