<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>The Lab</title>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
</script>
<link rel="preload" href="fonts/Barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="rail-wrap" aria-label="Tickets">
    <div class="rail" id="rail" role="list"></div>
  </aside>
  <main class="pass">
    <div class="banner" id="banner" hidden></div>
    <section class="ticket-scroll" id="scroll" aria-live="polite">
      <article class="ticket" id="ticket"></article>
    </section>
    <form class="composer" id="composer" autocomplete="off">
      <div class="queued" id="queued" hidden></div>
      <div class="composer-row">
        <label class="sr" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Send an order to the Mac" enterkeyhint="send"></textarea>
        <button type="button" class="btn stop" id="stop" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
          <span>Stop</span>
        </button>
        <button type="submit" class="btn send" id="send" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
          <span>Send</span>
        </button>
      </div>
    </form>
  </main>
</div>
<script src="../mock-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
