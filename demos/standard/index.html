<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>The Lab</title>
<link rel="preload" href="fonts/RobotoFlex.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12.2 19.6 4.6c.5-.2 1 .2.8.8L13 20.4c-.2.5-.9.5-1.1 0L9.6 14.4 4 12.2z"/><path d="M9.6 14.4 20 4.6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6.5 9.5 12 15l5.5-5.5"/></symbol>
    <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7 10 3 2.5L7 15M12.5 15H17"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4.5 4.5v12.5h-11.5z"/><path d="M13.5 3.5V8H18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.5 19.5h3.8L19 8.8l-3.8-3.8L4.5 15.7z"/><path d="m13.2 7 3.8 3.8"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/><path d="M3.5 12h17"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 17.5h2"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><path d="M9 6.5h10M9 12h10M9 17.5h10"/><path d="m4 6.5 1 1 2-2M4 12l1 1 2-2"/><circle cx="5.5" cy="17.5" r="1"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5 3 19.5h18z"/><path d="M12 10v4"/><path d="M12 16.9v.1"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3.5 5 6.3v5.4c0 4.2 2.9 7.3 7 8.8 4.1-1.5 7-4.6 7-8.8V6.3z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="bar">
    <div class="bar-title">
      <h1>The Lab</h1>
      <p class="bar-sub" id="sub"><span class="dot" aria-hidden="true"></span><span id="sub-text">Reaching the Mac</span></p>
    </div>
  </header>
  <div class="banner" id="banner" hidden>
    <svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>
    <p id="banner-text"></p>
    <button type="button" class="btn text" id="banner-action">Retry</button>
  </div>

  <div class="panes">
    <main class="thread" id="thread" aria-live="polite">
      <div class="thread-inner" id="list"></div>
    </main>
    <aside class="side" id="side" aria-label="Steps">
      <div class="side-head">
        <h2>Steps</h2>
        <p class="side-sub" id="side-sub"></p>
      </div>
      <ol class="steps open" id="side-steps"></ol>
    </aside>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <label class="field">
      <span class="sr">Message</span>
      <textarea id="input" rows="1" placeholder="Message your Mac" enterkeyhint="send"></textarea>
    </label>
    <button type="submit" class="fab" id="send" aria-label="Send">
      <svg class="ic" aria-hidden="true"><use href="#i-send"/></svg>
    </button>
  </form>
</div>

<script src="../mock-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
